plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.agentlink.nsh'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'io.agentlink.nsh'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
    kotlinOptions { jvmTarget = '21' }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-probe' }
        release { minifyEnabled false }
    }
}

dependencies {
    // Use the release runtime even in the probe: no remote code/dev server.
    implementation files('libs/nsh.aar')
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
}

tasks.register('verifyNshInputs') {
    doLast {
        def lock = new groovy.json.JsonSlurper().parse(rootProject.file('../toolchain.lock.json'))
        def aar = file('libs/nsh.aar')
        if (!aar.exists()) throw new GradleException('Run node native/scripts/setup.mjs first')
        def hash = java.security.MessageDigest.getInstance('SHA-256').digest(aar.bytes).encodeHex().toString()
        if (hash != lock.aar['nsh.aar']) throw new GradleException('NSH AAR checksum mismatch')
        if (!file('src/main/assets/nsh/bundle.nshc').exists())
            throw new GradleException('Run node native/scripts/build.mjs bundle first')
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyNshInputs' }
// The phase-zero probe is deliberately not a production release.
tasks.configureEach {
    if (name == 'assembleRelease' || name == 'bundleRelease') {
        doFirst { throw new GradleException('Phase-zero probe: release publishing is not configured') }
    }
}
