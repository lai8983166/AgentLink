plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// The location and all signing secrets stay outside tracked source.
def signingFile = file(System.getenv('AGENTLINK_SIGNING_PROPERTIES') ?: rootProject.file('keystore.properties'))
def signingProperties = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingProperties.load(it) }
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (releaseRequested && (!signingFile.exists() || ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].any { !signingProperties[it] })) {
    throw new GradleException('Release signing missing: set AGENTLINK_SIGNING_PROPERTIES to a private keystore.properties file')
}

android {
    namespace 'io.agentlink.nsh'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'io.agentlink.nsh'
        minSdk 28
        targetSdk 36
        versionCode 6
        versionName '0.1.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    // Direct APK downloads benefit from compression; Android extracts the native library at install time.
    packaging {
        jniLibs { useLegacyPackaging true }
        dex { useLegacyPackaging true }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
    kotlinOptions { jvmTarget = '21' }
    signingConfigs {
        if (signingFile.exists()) {
            localRelease {
                storeFile file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'; versionNameSuffix '-debug'
            ndk { abiFilters 'arm64-v8a', 'x86_64' }
        }
        release {
            ndk { abiFilters 'arm64-v8a' }
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.localRelease
        }
    }
}

dependencies {
    implementation project(':native-core')
    implementation 'androidx.core:core:1.17.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    // Embedded release runtime: no remote code/dev server.
    implementation files('libs/nsh.aar')
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
}

tasks.register('verifyNshInputs') {
    doLast {
        def lock = new groovy.json.JsonSlurper().parse(rootProject.file('../toolchain.lock.json'))
        def aar = file('libs/nsh.aar')
        if (!aar.exists()) throw new GradleException('Run node native/scripts/setup.mjs first')
        def hash = java.security.MessageDigest.getInstance('SHA-256').digest(aar.bytes).encodeHex().toString()
        if (hash != lock.aar['nsh.aar']) throw new GradleException('NSH AAR checksum mismatch')
        if (!file('src/main/assets/nsh/bundle.nshc').exists())
            throw new GradleException('Run node native/scripts/build.mjs bundle first')
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyNshInputs' }
