name: NSH Android
on:
  push:
    paths: &native_paths
      - 'native/**'
      - 'shared/**'
      - 'web/src/api/ws*'
      - 'web/src/session-state*'
      - 'mobile/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/native.yml'
  pull_request:
    paths: *native_paths
jobs:
  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.4.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-repository-privacy.mjs
      - run: pnpm --filter @agentlink/shared test
      - run: pnpm --filter @agentlink/web test
      - run: node native/scripts/setup.mjs
      - run: node native/scripts/build.mjs test
      - run: node native/scripts/build.mjs unit
      - run: node native/scripts/build.mjs apk
      - run: node native/scripts/build.mjs test-apk
      - run: pnpm --filter @agentlink/mobile sync
      - run: bash mobile/android/gradlew -p mobile/android :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      # Compiling instrumentation does not execute device tests.
